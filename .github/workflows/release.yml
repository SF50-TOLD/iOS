name: Release

# Pushing a version tag builds the release and finishes it: the app is archived and uploaded to App
# Store Connect, the version's release notes are written from CHANGELOG.md, and the build is
# attached to the version once Apple has processed it. Submitting for review is the only step left
# by hand.
#
# Re-tagging a version is how its build is replaced. The tag push runs all of this again and the
# version ends up pointing at the newer build; the older one stays on App Store Connect, since a
# build can be expired but never deleted. A tag push is a deploy, not bookkeeping.
#
# A version that has left the developer's hands is refused rather than re-pointed: ci_finish_release
# will not swap the binary under a submission Apple is already looking at.
#
# Nothing here re-runs the tests: tag a commit CI has already passed.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to build and upload.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@main
    with:
      platforms: '["iOS"]'
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      # Checked before the build number is resolved, on a runner with no credentials, so a missing
      # changelog section costs seconds rather than the whole archive — by then a build has reached
      # App Store Connect and neither that upload nor the tag can be taken back.
      verify-lane: ci_verify_release_notes
      finish-lane: ci_finish_release
      # DownloadNASR/Credentials.xcconfig is deliberately absent: it belongs to the DownloadNASR
      # macOS tool target, which the SF50 TOLD scheme does not build.
      secret-file-path: "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig"
      secret-file-template: |
        // NOTAM API Configuration (generated by CI)
        NOTAM_API_TOKEN = __SECRET_VALUE__
        NOTAM_API_BASE_URL = https:/$()/notams.fly.dev
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      secret-file-value: ${{ secrets.NOTAM_API_TOKEN }}
