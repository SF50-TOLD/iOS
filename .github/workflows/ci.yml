name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-ci.yml@main
    with:
      scheme: "SF50 TOLD"
      unit-test-plan: "SF50 Shared Unit Tests"
      ui-test-plan: "SF50 TOLD UI Tests"
      ui-timeout-minutes: 240
      test-execution-time-allowance: 900
      build-matrix: |
        {"include":[
          {"ios-label":"latest","runner":"macos-26","device":"iPhone 17 Pro","device-type":"com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro","os-version":"","xcode-version":"latest-stable"},
          {"ios-label":"18.4","runner":"macos-26","device":"iPhone 16 Pro","device-type":"com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro","os-version":"18.4","xcode-version":"latest-stable"}
        ]}
      ui-matrix: |
        {"include":[
          {"ios-label":"latest","runner":"macos-26","device":"iPhone 17 Pro","device-type":"com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro","os-version":"","xcode-version":"latest-stable"},
          {"ios-label":"latest","runner":"macos-26","device":"iPad Pro 13-inch (M5)","device-type":"com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB","os-version":"","xcode-version":"latest-stable"}
        ]}
      secret-file-path: "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig"
      secret-file-template: |
        // NOTAM API Configuration (generated by CI)
        NOTAM_API_TOKEN = __SECRET_VALUE__
        NOTAM_API_BASE_URL = https:/$()/notams.fly.dev
    secrets:
      secret-file-value: ${{ secrets.NOTAM_API_TOKEN }}
