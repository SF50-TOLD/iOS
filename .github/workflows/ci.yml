name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-ci.yml@main
    with:
      scheme: "SF50 TOLD"
      unit-test-plan: "SF50 Shared Unit Tests"
      ui-test-plan: "SF50 TOLD UI Tests"
      ui-timeout-minutes: 240
      test-execution-time-allowance: 900
      build-matrix: |
        {"include":[
          {"ios-label":"latest","runner":"macos-26","device":"iPhone 17 Pro","device-type":"com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro","os-version":"","xcode-version":"latest-stable"}
        ]}
      ui-matrix: |
        {"include":[
          {"ios-label":"latest","runner":"macos-26","device":"iPhone 17 Pro","device-type":"com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro","os-version":"","xcode-version":"latest-stable"},
          {"ios-label":"latest","runner":"macos-26","device":"iPad Pro 13-inch (M5)","device-type":"com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB","os-version":"","xcode-version":"latest-stable"}
        ]}
      secret-file-path: "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig"
      secret-file-template: |
        // NOTAM API Configuration (generated by CI)
        NOTAM_API_TOKEN = __SECRET_VALUE__
        NOTAM_API_BASE_URL = https:/$()/notams.fly.dev
    secrets:
      secret-file-value: ${{ secrets.NOTAM_API_TOKEN }}

  docs:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Generate NOTAM API config
        env:
          NOTAM_API_TOKEN: ${{ secrets.NOTAM_API_TOKEN }}
        run: |
          mkdir -p "SF50 TOLD/NOTAM"
          cat > "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig" << EOF
          NOTAM_API_TOKEN = ${NOTAM_API_TOKEN}
          NOTAM_API_BASE_URL = https:/\$()/notams.fly.dev
          EOF
      - name: Generate DownloadNASR credentials
        run: |
          cat > "DownloadNASR/Credentials.xcconfig" << EOF
          R2_ACCOUNT_ID = test
          R2_ACCESS_KEY_ID = test
          R2_SECRET_ACCESS_KEY = test
          R2_BUCKET_NAME = sf50-terrain
          R2_PUBLIC_URL = https:/\$()/test.invalid
          GITHUB_TOKEN = test
          EOF
      - name: Set up iOS simulator
        id: sim
        uses: RISCfuture/XCUITestKit/ci-templates/setup-ios-simulator@main
        with:
          device: "iPhone 17 Pro"
          device-type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/docs-dd
            ${{ runner.temp }}/docs-dd-nasr
          key: derived-docs-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      # The SF50 TOLD scheme reaches every first-party target the app ships — the app, the SF50
      # Runways extension, TerrainAssets, and the SF50 Shared framework — so one docbuild covers
      # all of the catalogs that ship with the app. DocC has no strictness build setting of its
      # own, so `--warnings-as-errors` reaches it through OTHER_DOCC_FLAGS, which the project sets
      # on its own targets: passing that setting to xcodebuild here would apply it to every Swift
      # package in the graph too, and a dependency's DocC warnings are not this project's to fix.
      # Nothing consumes the .doccarchives, so they build into the runner's scratch directory
      # rather than the checkout.
      - name: Build documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -project "SF50 TOLD.xcodeproj" \
            -scheme "SF50 TOLD" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -destination-timeout 300 \
            -derivedDataPath "$RUNNER_TEMP/docs-dd" \
            | xcbeautify --renderer github-actions
      # DownloadNASR is a macOS build tool outside the SF50 TOLD scheme, so its catalog needs a
      # docbuild of its own to be gated. Its target inherits the project's OTHER_DOCC_FLAGS, so
      # this pass is as strict as the iOS one. Unlike the simulator build above, a macOS target
      # would demand a Mac Development certificate the runner has no keychain for; documentation
      # is extracted from the compiled sources, so the build has nothing to sign.
      - name: Build DownloadNASR documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -project "SF50 TOLD.xcodeproj" \
            -scheme "DownloadNASR" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/docs-dd-nasr" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
