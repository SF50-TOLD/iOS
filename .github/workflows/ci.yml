name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate NOTAM API config
        env:
          NOTAM_API_TOKEN: ${{ secrets.NOTAM_API_TOKEN }}
          NOTAM_API_BASE_URL: ${{ secrets.NOTAM_API_BASE_URL }}
        run: |
          mkdir -p "SF50 TOLD/NOTAM"
          cat > "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig" << EOF
          NOTAM_API_TOKEN = ${NOTAM_API_TOKEN}
          NOTAM_API_BASE_URL = https:/\$()/notams.fly.dev
          EOF
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Run unit tests
        run: xcodebuild test -retry-tests-on-failure -test-iterations 3 -scheme "SF50 Shared" -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2" | xcpretty && exit ${PIPESTATUS[0]}

  ui:
    name: UI Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate NOTAM API config
        env:
          NOTAM_API_TOKEN: ${{ secrets.NOTAM_API_TOKEN }}
          NOTAM_API_BASE_URL: ${{ secrets.NOTAM_API_BASE_URL }}
        run: |
          mkdir -p "SF50 TOLD/NOTAM"
          cat > "SF50 TOLD/NOTAM/NOTAMAPIConfig.xcconfig" << EOF
          NOTAM_API_TOKEN = ${NOTAM_API_TOKEN}
          NOTAM_API_BASE_URL = https:/\$()/notams.fly.dev
          EOF
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Configure simulator
        run: |
          # Boot simulator
          xcrun simctl boot "iPhone 17 Pro" || true
          # Wait for simulator to boot
          xcrun simctl bootstatus "iPhone 17 Pro" || true
      - name: Run UI tests
        run: xcodebuild test -retry-tests-on-failure -test-iterations 3 -scheme "SF50 TOLD" -testPlan "SF50 TOLD UI Tests" -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2" | xcpretty && exit ${PIPESTATUS[0]}
