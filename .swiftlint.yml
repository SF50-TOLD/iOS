parent_config: https://gist.githubusercontent.com/RISCfuture/c57d132e5e0160a768df1625e20ae3b8/raw/.swiftlint.yml

# SnapshotHelper.swift is fastlane's verbatim vendored helper — keep it in step with upstream rather
# than reformatting it to satisfy our rules.
excluded:
  - fastlane
  - Generate Screenshots/SnapshotHelper.swift

disabled_rules:
  - missing_docs
  - pattern_matching_keywords
  # This project uses Swift Testing for unit tests and XCUITest for UI tests;
  # Quick and Nimble are not used, so their opt-in rules do not apply.
  - prefer_nimble
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
